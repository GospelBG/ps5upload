[package]
name = "ps5upload-tests"
version.workspace = true
edition.workspace = true
license.workspace = true

[dev-dependencies]
anyhow.workspace = true
# The retired protocol's integration tests (and their mock server) stay until the FTX2
# baseline is recorded (P3 Task 18 Step 3); the ava1_* tests below are their replacements.
ftx2-proto = { path = "../ftx2-proto" }
ps5upload-core = { path = "../ps5upload-core" }
# The AVA1 test console: the Rust job host and a scripted management node.
ava1 = { path = "../ava1" }
ava1-chaos = { path = "../ava1-chaos" }
ps5upload-ava1 = { path = "../ps5upload-ava1" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
serde.workspace = true
serde_json.workspace = true
# Build .zip fixtures for the zip-transfer integration tests.
zip = { version = "8", default-features = false, features = ["deflate"] }
# Build .7z fixtures for the 7z-transfer integration tests. The `compress`
# feature (encoder) is test-only and pure Rust (lzma-rust2/encoder); the
# production engine crate pins sevenz-rust2 with default-features=false.
sevenz-rust2 = { version = "0.23", features = ["compress"] }
crc32fast = "1"
