[package]
name = "ava1"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "time", "sync", "io-util"] }
blake2 = "0.10"
chacha20poly1305 = "0.10"
getrandom = "0.4"
snow = { version = "0.10", features = ["risky-raw-split"] }
x25519-dalek = { version = "3", features = ["static_secrets"] }

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "time", "sync", "io-util", "macros", "rt-multi-thread", "test-util"] }
ava1-chaos = { path = "../ava1-chaos" }
